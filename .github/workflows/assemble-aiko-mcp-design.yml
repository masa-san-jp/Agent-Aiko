name: Assemble Aiko MCP design document

on:
  push:
    branches: [main]
    paths:
      - 'docs/.upload-chunks/aiko-mcp-design/**'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble markdown
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat docs/.upload-chunks/aiko-mcp-design/chunk-* | tr -d '\n' | base64 --decode > docs/20260730-aiko-mcp-usage-distribution-maintenance-design.md
          test -s docs/20260730-aiko-mcp-usage-distribution-maintenance-design.md
      - name: Commit generated document
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/20260730-aiko-mcp-usage-distribution-maintenance-design.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'docs: add Aiko MCP usage and maintenance design'
          git push
