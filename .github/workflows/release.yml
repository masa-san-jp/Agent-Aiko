name: Release

# 設計書 §10.1（GitHub Releases に成果物・checksum・署名）／§11.4（Supply Chain）。
#
# タグを打ったときだけ動く。main への push では動かさない。「main の先端を配る」の
# をやめて「タグを打ったものを配る」に変えるのが、この工程を置く目的（Threat Model
# T1: main に1コミット入るだけで全新規導入者へ届く状態を無くす）。
#
# 配布物は `git archive` で作る。ビルド成果物もタイムスタンプも混ぜないので、
# 同じタグから作り直せば同じ tar.gz が出る（同一環境で2回作って checksum 一致を実測）。
# checksum を配る以上、それを手元で再現できる形にしておきたいため。
# ただし git のバージョン差まで含めた再現性は検証していない。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '成果物を作るタグ（例: v0.1.0）'
        required: true

# 権限はジョブごと。verify が依存の install script を動かしても、
# Release の書き換えや OIDC での公開はできない。
permissions:
  contents: read

jobs:
  verify:
    name: verify / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      # dispatch は任意の ref を渡せる。main に含まれないコミットを、
      # レビュー前にこのワークフローへ載せない。
      - name: Dispatch tag must already be on main
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "refusing ref: ${RELEASE_TAG}" >&2; exit 1 ;;
          esac
          case "$RELEASE_TAG" in
            *[!A-Za-z0-9._-]*) echo "refusing ref: ${RELEASE_TAG}" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_TAG" FETCH_HEAD

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      # 落ちたものを配らない。CI と同じ手順をタグに対してもう一度通す。
      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=high

  release:
    name: release
    needs: verify
    runs-on: ubuntu-latest
    # GitHub の Environment に required reviewers を付けると、公開前に人が止まれる。
    # 環境の保護ルール自体はリポジトリ設定側で有効にする。
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag
        id: meta
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "refusing ref: ${tag}" >&2; exit 1 ;;
          esac
          case "$tag" in
            *[!A-Za-z0-9._-]*) echo "refusing ref: ${tag}" >&2; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$tag" FETCH_HEAD
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          # 設計書 §10.2 の channel。v1.2.3 は stable、v1.2.3-beta.1 のように
          # ハイフンが付くものは beta として prerelease で出す。
          if [ "${tag#*-}" != "$tag" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Build distribution archive
        id: archive
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          name="agent-aiko-${tag}"
          mkdir -p dist-release
          # git archive はタグの中身をそのまま固める。ビルド成果物を含まないので、
          # 同じタグから作り直せば同じ checksum が出る。
          git archive --format=tar.gz --prefix="${name}/" -o "dist-release/${name}.tar.gz" "$tag"
          # Old updaters do not recognize these user-owned paths. Refuse to
          # publish a template containing any of them.
          tar -tzf "dist-release/${name}.tar.gz" > dist-release/archive-files.txt
          prefix="${name}/claude-code/template/.claude/aiko"
          while IFS= read -r entry; do
            case "$entry" in
              "$prefix/user-profile.json"|"$prefix/user-proposal.md"|"$prefix/speech-style"|"$prefix/speech-style-proposal"|"$prefix/speech-styles"|"$prefix/speech-styles/"*|"$prefix/persona/origin/user.md"|"$prefix/persona/override"|"$prefix/persona/override/"*)
                echo "refusing archive containing an unsafe legacy update target" >&2
                exit 1
                ;;
            esac
          done < dist-release/archive-files.txt
          rm dist-release/archive-files.txt
          cd dist-release
          sha256sum "${name}.tar.gz" > SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS

      # SBOM。何が入っているかを機械可読で添える（Threat Model §5-3）。
      # 依存の汚染（T7）が起きたとき、影響範囲を「入っているかどうか」で引けるようにする。
      # npm 標準の出力なので追加の道具を入れない。
      - name: Build SBOM
        env:
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm sbom --sbom-format spdx --omit dev > "dist-release/${ARCHIVE_NAME}.spdx.json"
          node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" \
            "dist-release/${ARCHIVE_NAME}.spdx.json"
          ls -la dist-release/

      # 署名。GitHub の attestation は鍵の管理が要らず、「この成果物はこのリポジトリの
      # このワークフローが作った」を後から検証できる（`gh attestation verify`）。
      # 設計書 §11.4 の signed tag は別途 GPG 鍵が要るため、本工程には含めない。
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist-release/${{ steps.archive.outputs.name }}.tar.gz

      # notes は引用符付きヒアドキュメント（<<'EOF'）で書く。引用しないと本文中の
      # バッククォートがシェルのコマンド置換として実行される。GitHub の ${{ }} は
      # シェルより前に展開されるので、引用しても値は入る。
      - name: Write release notes
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          channel: __CHANNEL__

          ## 取得したものが本物か確かめる

          ```bash
          # 1. 成果物と checksum を落とす
          gh release download __TAG__ --repo __REPO__ \
            --pattern '*.tar.gz' --pattern 'SHA256SUMS'

          # 2. 中身が置いたものと同じか
          sha256sum -c SHA256SUMS

          # 3. このリポジトリのワークフローが作ったものか（gh 2.49 以上が必要）
          gh attestation verify __ARCHIVE__.tar.gz --repo __REPO__
          ```

          `gh attestation` は gh 2.49 で入ったサブコマンド。それより古いと 3 は実行できない
          （`gh --version` で確認できる）。

          2 は配送途中の破損・改竄を、3 は出どころを確かめる。3 まで通って初めて
          「GitHub 上で差し替えられていない」と言える。

          この成果物は `git archive` でタグの中身をそのまま固めたもの。ビルド結果を
          含まないので、同じ git で作り直せば同じ checksum が出る。
          EOF
          # タグは Resolve tag で v* かつ記号を弾いてある。プレースホルダの置換だけをする。
          sed -i \
            -e "s/__CHANNEL__/${RELEASE_CHANNEL}/g" \
            -e "s/__TAG__/${RELEASE_TAG}/g" \
            -e "s/__REPO__/${REPOSITORY//\//\\/}/g" \
            -e "s/__ARCHIVE__/${ARCHIVE_NAME}/g" \
            release-notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          ARCHIVE_NAME: ${{ steps.archive.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          name="$ARCHIVE_NAME"
          # set -e の下で `cond && cmd` を単独文に置くと、cond が偽のときに
          # スクリプトごと終了する（stable リリースが必ずここで死ぬ）。if で書く。
          extra=""
          if [ "$PRERELEASE" = "true" ]; then
            extra="--prerelease"
          fi
          # shellcheck disable=SC2086
          gh release create "$tag" \
            "dist-release/${name}.tar.gz" \
            "dist-release/${name}.spdx.json" \
            dist-release/SHA256SUMS \
            --repo "$REPOSITORY" \
            --title "$tag" \
            --notes-file release-notes.md \
            $extra
