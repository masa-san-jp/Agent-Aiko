name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, release/aiko-mcp-0.3.3-base]

permissions:
  contents: read

jobs:
  sns-script:
    name: sns-script / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

  reference:
    name: reference / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test reference/tools/peer-inbox.test.mjs

  voice:
    name: voice / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test voice/test/*.test.mjs

  antigravity:
    name: antigravity / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test antigravity/test/*.test.mjs

  # installer は一番ユーザーに近いのに、これまで CI で1度も動いていなかった。
  # §16 が主要 OS での検証を求めているので、macOS も回す——sha256 の道具名も
  # tar の実装も違うため、Linux で通ったことは macOS で通る根拠にならない。
  claude-code:
    name: claude-code / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test claude-code/test/*.test.mjs

  packages:
    name: packages / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json

      # packages/* は npm workspace。ルートで一度入れれば相互参照が解決し、
      # devDependencies も共有される。パッケージごとに入れていた頃は、
      # file: 依存に devDependencies が入らず依存先が自分をビルドできないため、
      # CI にビルド順序を手で書く必要があった。
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  maintenance-source:
    name: maintenance / prepare Windows sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive only the sources required for maintenance
        run: git archive --format=tar -o maintenance-source.tar HEAD -- package.json package-lock.json tsconfig.json tsconfig.base.json README.md LICENSE packages claude-code/template .github/scripts/test-maintenance-windows.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: maintenance-windows-source
          path: maintenance-source.tar
          retention-days: 1

  maintenance-windows:
    name: maintenance / Windows / Node 22
    runs-on: windows-latest
    needs: maintenance-source
    steps:
      # Some unrelated repository filenames cannot be checked out on Windows.
      - name: Download source subset
        uses: actions/download-artifact@v4
        with:
          name: maintenance-windows-source
          path: ${{ runner.temp }}/maintenance-source
      - name: Extract sources
        run: tar -xf "$env:RUNNER_TEMP/maintenance-source/maintenance-source.tar"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build package
        run: npm run build --workspace=aiko-mcp
      - name: Test packaged maintenance behavior
        run: node --import tsx --test packages/mcp-server/test/maintenance.test.ts
      - name: Pack candidate
        run: npm pack --ignore-scripts --workspace=aiko-mcp --pack-destination "$env:RUNNER_TEMP"
      - name: Test documented PowerShell workflow
        run: node .github/scripts/test-maintenance-windows.mjs

  schemas:
    name: schemas / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: schemas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: schemas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  codex:
    name: codex / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: codex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: codex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  # 設計書 §12.2 が PR CI に dependency audit を挙げているが、実装されていなかった
  # （Threat Model T7）。lockfile ごとに監査する。閾値を high にしているのは、
  # low / moderate で赤を常態化させると、本当に危ない1件が埋もれるため。
  dependency-audit:
    name: dependency-audit / ${{ matrix.dir }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', 'schemas', 'codex']
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit
        run: npm audit --audit-level=high
