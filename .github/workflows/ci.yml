name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sns-script:
    name: sns-script / Python 3.12
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r .github/scripts/requirements.txt

      - name: Run tests
        run: python -m unittest discover -s .github/scripts -p "test_*.py" -v

  antigravity:
    name: antigravity / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: node --test antigravity/test/*.test.mjs

  core:
    name: core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: packages/core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/core/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  adapter-claude-code:
    name: adapter-claude-code / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # file:../core は symlink で張られ、リンクされたローカル依存には
      # devDependencies が入らない。core は自分をビルドできないので先に済ませる。
      - name: Build @agent-aiko/core
        run: |
          npm ci --prefix packages/core
          npm run build --prefix packages/core

      - name: Install dependencies
        run: npm ci --prefix packages/adapter-claude-code

      - name: Typecheck
        run: npm run typecheck --prefix packages/adapter-claude-code

      - name: Test
        run: npm test --prefix packages/adapter-claude-code

  mcp-server:
    name: mcp-server / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # @agent-aiko/core は file:../core 依存で、npm はこれを symlink として張る。
      # ローカル依存の devDependencies（typescript）は入らないため、core 自身の
      # ビルドを先に済ませておく必要がある。順序を入れ替えると dist が無いまま
      # 解決に失敗する。
      - name: Build @agent-aiko/core
        run: |
          npm ci --prefix packages/core
          npm run build --prefix packages/core

      - name: Install dependencies
        run: npm ci --prefix packages/mcp-server

      - name: Typecheck
        run: npm run typecheck --prefix packages/mcp-server

      - name: Test
        run: npm test --prefix packages/mcp-server

  schemas:
    name: schemas / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: schemas
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: schemas/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

  codex:
    name: codex / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    defaults:
      run:
        working-directory: codex
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: codex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
