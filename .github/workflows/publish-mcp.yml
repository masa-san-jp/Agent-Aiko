name: Publish to npm and MCP Registry

# タグを打つと、npm へ公開し、その版を公式 MCP レジストリの一覧に載せる。
#
# npm 側の認証は trusted publishing（OIDC）。**トークンを一切置かない。**
# 2026-07-31 に npm は 2FA をバイパスする granular token の権限を絞り、2027-01 には
# 直接公開もできなくなる予定になった。長命なトークンを持ち続ける形は行き止まりなので、
# 「この repo のこの workflow から出た job だ」と GitHub が証明する方式へ移す。
# 副産物として provenance（どのコードから作られたかの証明）が自動で付く。
#
# レジストリ側も同じ OIDC。名前空間 io.github.masa-san-jp/ を名乗れる根拠がそれ。
#
# npmjs.com 側に1度だけ設定が要る（package settings > Trusted Publisher）:
#   Organization or user: masa-san-jp / Repository: Agent-Aiko
#   Workflow filename: publish-mcp.yml / Allowed actions: npm publish
# **このファイル名を変えると公開が止まる**（npm 側は名前で照合している）。
#
# 依存の install script は、OIDC を持つジョブでは動かさない。build と test は
# contents: read だけのジョブで行い、公開ジョブは出来上がったファイルだけを受け取る。
# Environment `npm-publish` に required reviewers を付けると、公開の前に人が止まれる。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '公開するタグ（例: v0.2.0）。main に含まれるタグだけ'
        required: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false
          fetch-depth: 0

      - name: Tag must be a release tag on main
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-$REF_NAME}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "refusing ref: ${tag}" >&2; exit 1 ;;
          esac
          case "$tag" in
            *[!A-Za-z0-9._-]*) echo "refusing ref: ${tag}" >&2; exit 1 ;;
          esac
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            git fetch --no-tags origin main
            git merge-base --is-ancestor "$tag" FETCH_HEAD
          fi

      - name: server.json と package.json の食い違いが無いか確かめる
        working-directory: packages/mcp-server
        run: |
          node -e '
            const pkg = require("./package.json");
            const server = require("./server.json");
            const mismatch = [];
            if (pkg.mcpName !== server.name) mismatch.push(`name: ${pkg.mcpName} != ${server.name}`);
            if (pkg.version !== server.version) mismatch.push(`version: ${pkg.version} != ${server.version}`);
            for (const p of server.packages ?? []) {
              if (p.identifier !== pkg.name) mismatch.push(`package: ${p.identifier} != ${pkg.name}`);
              if (p.version !== pkg.version) mismatch.push(`package version: ${p.version} != ${pkg.version}`);
            }
            if (mismatch.length) { console.error(mismatch.join("\n")); process.exit(1); }
          '

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: 版の前提を満たしているか確かめる
        run: |
          echo "node $(node -v) / npm $(npm -v)"
          node -e '
            const [maj, min] = process.versions.node.split(".").map(Number);
            if (maj < 22 || (maj === 22 && (min < 14))) {
              console.error(`Node 22.14 以上が要る: ${process.versions.node}`);
              process.exit(1);
            }
          '
          npm_v=$(npm -v)
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number);
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)));
            if (!ok) { console.error(`npm 11.5.1 以上が要る: ${process.argv[1]}`); process.exit(1); }
          ' "$npm_v"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Pack the built files
        run: tar -czf mcp-pack.tgz -C packages/mcp-server dist persona LICENSE

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: mcp-pack
          path: mcp-pack.tgz

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          persist-credentials: false

      - name: Download built package
        uses: actions/download-artifact@v4
        with:
          name: mcp-pack

      - name: Unpack built package
        run: tar -xzf mcp-pack.tgz -C packages/mcp-server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      # 依存は入れない。install script を、OIDC を持つジョブで動かさない。
      # --ignore-scripts は prepack の再ビルドも止める。verify が作った dist をそのまま出す。
      - name: npm へ公開
        working-directory: packages/mcp-server
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "${name}@${version} は公開済み。npm publish は飛ばす"
          else
            npm publish --ignore-scripts --access public
          fi

      - name: npm に載ったか確かめる
        run: |
          name=$(node -p "require('./packages/mcp-server/package.json').name")
          version=$(node -p "require('./packages/mcp-server/package.json').version")
          for i in $(seq 1 12); do
            if npm view "${name}@${version}" version; then exit 0; fi
            echo "まだ見えない（${i}/12）。10秒待つ"
            sleep 10
          done
          echo "${name}@${version} が npm に見つかりません"
          exit 1

      - name: mcp-publisher を入れる
        env:
          MCP_PUBLISHER_VERSION: v1.8.0
          MCP_PUBLISHER_SHA256: 1370446bbe74d562608e8005a6ccce02d146a661fbd78674e11cc70b9618d6cf
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help

      - name: レジストリへログイン（OIDC）
        run: ./mcp-publisher login github-oidc

      - name: レジストリへ登録
        working-directory: packages/mcp-server
        run: ../../mcp-publisher publish

      - name: レジストリに載ったか確かめる
        run: |
          name=$(node -p "require('./packages/mcp-server/package.json').mcpName")
          curl -fsS "https://registry.modelcontextprotocol.io/v0.1/servers?search=${name}" -o found.json
          node -e '
            const pkg = require("./packages/mcp-server/package.json");
            const want = pkg.version;
            const { servers = [] } = require("./found.json");
            const mine = servers.filter((s) => (s.name ?? s.server?.name) === pkg.mcpName);
            const versions = mine.map((s) => s.version ?? s.server?.version);
            if (!versions.includes(want)) {
              console.error(`${want} が見つかりません。返ってきたもの: ${JSON.stringify(versions)}`);
              process.exit(1);
            }
            console.log(`登録を確認: ${pkg.mcpName} ${want}`);
          '
